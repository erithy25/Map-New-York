[/Script/NYCSimRuntime.NYCGameplaySettings]
; Gameplay budgets for the 8 GB target card (RTX 3060 Ti). The defaults in NYCGameplaySettings.h were
; chosen for a 12 GB card; these are the numbers that let the city run, and each one can be raised
; once the frame time on the real machine has been measured rather than guessed.
;
; Traffic and crowd are the largest per-frame cost after the world itself: every vehicle is a skeletal
; mesh with its own lamp material instances, every pedestrian an animated character. 250 and 300 fill
; a Midtown avenue convincingly; 900 and 1400 fill it the way a photograph does and cost accordingly.
MaxTrafficVehicles=250
MaxPedestrians=300
; Three USceneCaptureComponent2D re-rendering the world every frame is the single most expensive
; feature on the car. Off until the frame budget is known; MirrorMaxRangeMetres already exists for
; turning them back on only when something is close enough to be worth reflecting.
MirrorResolution=0
CentreScreenResolution=256
