[/Script/Engine.RendererSettings]
;
; Target GPU: 8 GB (RTX 3060 Ti). This section was written for a 12 GB card with hardware ray
; tracing; on 8 GB the settings below are not a quality preference but the difference between the
; city running and the driver evicting textures every frame. Each line says what it costs.
;
; Lumen GI + reflections, virtual shadow maps, Nanite. Software Lumen, because the hardware-ray-traced
; BVH for a Nanite city is hundreds of megabytes of VRAM and the 3060 Ti's second-generation RT cores
; do not earn it back.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
; Mesh SDF tracing is what software Lumen traces against, so it goes ON exactly when HWRT goes off.
r.Lumen.TraceMeshSDFs=1
r.Lumen.HardwareRayTracing=0
r.Lumen.HardwareRayTracing.LightingMode=0
r.Lumen.ScreenProbeGather.RadianceCache=1
; Nothing else in the project uses ray tracing, so the whole RT geometry pool goes back.
r.RayTracing=0
; The skin cache is only needed to ray-trace skinned meshes. Off, it also cuts the shader permutation
; count and the DDC, which matters on a machine with 196 GB free rather than a terabyte.
r.SkinCache.CompileShaders=False
r.Shadow.Virtual.Enable=1
; The virtual shadow map page pool is the other large VRAM consumer after textures. A positive bias
; halves the directional resolution; at 1080p the difference is visible only on a still frame.
r.Shadow.Virtual.ResolutionLodBiasDirectional=0.5
r.Shadow.Virtual.MaxPhysicalPages=2048
r.Nanite=1
r.Nanite.ProjectEnabled=True
r.GenerateMeshDistanceFields=True
r.DistanceFields.DefaultVoxelDensity=0.2
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8
r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8
r.DefaultFeature.MotionBlur=True
r.DefaultFeature.Bloom=True
r.DefaultFeature.AmbientOcclusion=False
r.DefaultFeature.AmbientOcclusionStaticFraction=False
r.AntiAliasingMethod=4
r.TemporalAA.Upsampling=True
; The TSR history is a full-resolution target; at 200 % it is four times the size for a sharpness
; difference that a 1080p output does not resolve.
r.TSR.History.ScreenPercentage=100
r.ScreenPercentage=75
r.SupportSkyAtmosphere=True
r.SupportSkyAtmosphereAffectsHeightFog=True
r.VolumetricFog=1
; Volumetric clouds and real-time sky capture are each 1-2 ms and their own VRAM. Off until the
; frame budget on the target card is measured; the sky still has its cloud layer and its capture,
; just not recomputed every frame.
r.VolumetricCloud=0
r.SupportLocalFogVolumes=True
r.AllowStaticLighting=False
r.VirtualTextures=True
r.VirtualTexturedLightmaps=False
r.VT.TileSize=128
r.VT.TileBorderSize=4
; 4 GB of texture pool on an 8 GB card leaves nothing for Nanite, Lumen and the shadow pages.
r.Streaming.PoolSize=1500
r.Nanite.Streaming.StreamingPoolSize=256
r.Streaming.UseAllMips=0
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.MaxNumTexturesToStreamPerFrame=30
r.Streaming.Boost=1.5
r.TextureStreaming=True
r.MeshStreaming=1
r.HZBOcclusion=1
r.Mobile.EnableNoPrecomputedLightingCSMShader=0
r.GBufferFormat=1
r.CustomDepth=3
r.Substrate=False
r.Water.SingleLayerWater.SupportCloudShadow=1
r.SkyLight.RealTimeReflectionCapture=0
r.SkyLight.RealTimeReflectionCapture.TimeSlice=1
r.SkyLight.RealTimeReflectionCapture.DepthBuffer=1
r.HeightFogGlobalDensityScale=1
r.Shaders.Optimize=1
r.ShaderDevelopmentMode=0
; the ESB crown and lit windows rely on emissive bloom being physically scaled
r.EyeAdaptation.PreExposureOverride=0
r.LightFunctionAtlas.Format=1

