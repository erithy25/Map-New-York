[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nycsim-pipeline"
version = "1.0.0"
description = "NYCSim data pipeline: NYC Open Data / USGS / OSM / MTA -> 1:1 world tiles"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26", "scipy", "shapely>=2.0", "pyproj>=3.6", "pyogrio", "geopandas>=1.0", "rasterio>=1.3",
  "pyarrow>=15", "polars", "osmium", "lxml", "requests", "tqdm", "mapbox_earcut", "trimesh", "pillow", "networkx", "rtree", "orjson",
]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis"]

[tool.setuptools.packages.find]
where = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests", "pipeline/tests"]
